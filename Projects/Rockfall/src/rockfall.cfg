# Track 0: stage-2 loader (boot ROM loads $0800-$0AFF); tracks 1+: game at $6000.
# File = 4K track-0 image followed by the game image (laid out in physical sector order).
MEMORY { BOOTM: start=$0800, size=$1000, fill=yes, fillval=0, file=%O;
         GAME:  start=$6000, size=$6000, file=%O; }
SEGMENTS { BOOT: load=BOOTM, type=ro; DNIB: load=BOOTM, type=ro, start=$0A96;
           CODE: load=GAME, type=ro; RODATA: load=GAME, type=ro; BSS: load=GAME, type=bss, define=yes; }
