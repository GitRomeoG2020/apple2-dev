# 4K physical-order boot track, then 24K at $6000. No DOS or disk writes.
MEMORY {
 BOOTM: start=$0800, size=$1000, fill=yes, file=%O;
 GAME: start=$6000, size=$2000, fill=yes, file=%O;
 ROOM: start=$8000, size=$2000, fill=yes, file=%O;
 ART: start=$A000, size=$2000, fill=yes, file=%O;
}
SEGMENTS {
 BOOT: load=BOOTM, type=ro;
 DNIB: load=BOOTM, type=ro, start=$0B96;
 CODE: load=GAME, type=ro;
 RODATA: load=GAME, type=ro, align=$100;
 BACKGROUND: load=ROOM, type=ro;
 SPRITES: load=ART, type=ro;
}
