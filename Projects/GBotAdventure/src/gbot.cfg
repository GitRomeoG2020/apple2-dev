# Disk order: 4K physical-order boot track, 24K at $6000 (tracks 1-6; the
# workshop is 3-4), then each room beside its 4K "aux" track (message bank +
# actor frames, read to $1000-$1FFF with the room): workshop aux 7 (read at
# boot), power room dark 8-9, lit 10-11, aux 12; security 13-14, aux 15;
# lab 16-17, aux 18. Rooms stream into $8000. No writes.
MEMORY {
 BOOTM: start=$0800, size=$1000, fill=yes, file=%O;
 GAME: start=$6000, size=$2000, fill=yes, file=%O;
 ROOM: start=$8000, size=$2000, fill=yes, file=%O;
 ART: start=$A000, size=$2000, fill=yes, file=%O;
 LOW3: start=$1000, size=$1000, fill=yes, file=%O;
 POWER: start=$8000, size=$2000, fill=yes, file=%O;
 POWERLIT: start=$8000, size=$2000, fill=yes, file=%O;
 LOW4: start=$1000, size=$1000, fill=yes, file=%O;
 SECURITY: start=$8000, size=$2000, fill=yes, file=%O;
 LOW: start=$1000, size=$1000, fill=yes, file=%O;
 LAB: start=$8000, size=$2000, fill=yes, file=%O;
 LOW2: start=$1000, size=$1000, fill=yes, file=%O;
}
SEGMENTS {
 BOOT: load=BOOTM, type=ro;
 DNIB: load=BOOTM, type=ro, start=$0B96;
 CODE: load=GAME, type=ro;
 RODATA: load=GAME, type=ro, align=$100;
 BACKGROUND: load=ROOM, type=ro;
 SPRITES: load=ART, type=ro;
 POWERROOM: load=POWER, type=ro;
 POWERLIT: load=POWERLIT, type=ro;
 SECURITYROOM: load=SECURITY, type=ro;
 SECAUX: load=LOW, type=ro;
 LABROOM: load=LAB, type=ro;
 LABAUX: load=LOW2, type=ro;
 WORKAUX: load=LOW3, type=ro;
 POWERAUX: load=LOW4, type=ro;
}
