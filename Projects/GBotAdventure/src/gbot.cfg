# Disk order (tracks: src/layout.inc): 4K physical-order boot track; 12K of
# code and tables (tracks 1-3, linked for $D000: the boot reads them to $6000
# and moves them into language-card RAM); the stamp pool (4, read at boot into
# LC bank 1: the lit power room's script and stamps); the workshop room (5-6)
# and G-Bot's frames (7-8), read at boot to $8000-$BFFF; then the 4K "aux"
# tracks (message bank, actor frames and stamp scripts, read to $1000-$1FFF)
# and the remaining full-art room: workshop aux 9 (boot), power aux 10 (the
# dark room is drawn from stamps on it), security aux 11 (stamps), lab aux 12
# (stamps, a few more in the pool). Rooms are drawn into $8000. No writes.
MEMORY {
 BOOTM: start=$0800, size=$1000, fill=yes, file=%O;
 GAME: start=$D000, size=$3000, fill=yes, file=%O;
 POOLM: start=$D000, size=$1000, fill=yes, file=%O;
 ROOM: start=$8000, size=$2000, fill=yes, file=%O;
 ART: start=$A000, size=$2000, fill=yes, file=%O;
 LOW3: start=$1000, size=$1000, fill=yes, file=%O;
 LOW4: start=$1000, size=$1000, fill=yes, file=%O;
 LOW: start=$1000, size=$1000, fill=yes, file=%O;
 LOW2: start=$1000, size=$1000, fill=yes, file=%O;
}
SEGMENTS {
 BOOT: load=BOOTM, type=ro;
 DNIB: load=BOOTM, type=ro, start=$0B96;
 BOOT2: load=BOOTM, type=ro, start=$0C00;
 CODE: load=GAME, type=ro;
 RODATA: load=GAME, type=ro, start=$E000;
 LCHI: load=GAME, type=ro;
 POOL: load=POOLM, type=ro;
 BACKGROUND: load=ROOM, type=ro;
 SPRITES: load=ART, type=ro;
 WORKAUX: load=LOW3, type=ro;
 POWERAUX: load=LOW4, type=ro;
 SECAUX: load=LOW, type=ro;
 LABAUX: load=LOW2, type=ro;
}
